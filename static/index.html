<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opportunity Navigator — Find your next big break</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a class="brand" href="#/discover">
    <span class="brand-mark">ON</span>
    <span class="brand-name">Opportunity Navigator</span>
  </a>
  <nav aria-label="Primary">
    <span>
      <button type="button" data-mode="discover" class="active">Discover</button>
      <button type="button" data-mode="wishlist">Wishlist <span id="saved-count"></span></button>
    </span>
    <span class="who">Signed in as Amara</span>
  </nav>
</header>

<section class="hero" id="hero">
  <h1>Find your next big break.</h1>
  <p>Curated fellowships, internships and scholarships for Africa's next generation of leaders.</p>
  <form class="search-row" onsubmit="return false">
    <input type="search" id="q" placeholder="Search by name, field or location…" aria-label="Search opportunities">
    <button class="btn ghost" type="submit">Search</button>
  </form>
</section>

<div class="page-grid">
  <aside class="filters" aria-label="Filters">
    <h2>Filter</h2>

    <fieldset>
      <legend>Field</legend>
      <label class="chk"><input type="checkbox" value="STEM"> STEM</label>
      <label class="chk"><input type="checkbox" value="Business"> Business</label>
      <label class="chk"><input type="checkbox" value="Arts"> Arts</label>
      <label class="chk"><input type="checkbox" value="Humanities"> Humanities</label>
      <label class="chk"><input type="checkbox" value="Social Impact"> Social Impact</label>
      <label class="chk"><input type="checkbox" value="Leadership"> Leadership</label>
    </fieldset>

    <fieldset>
      <legend>Status</legend>
      <label class="chk"><input type="checkbox" value="open"> Open now</label>
      <label class="chk"><input type="checkbox" value="soon"> Opening soon</label>
      <label class="chk"><input type="checkbox" value="closed"> Closed</label>
    </fieldset>

    <label class="fld" for="loc">Location</label>
    <input type="text" id="loc" placeholder="e.g. Remote">

    <label class="fld" for="min">Minimum stipend (USD)</label>
    <input type="number" id="min" placeholder="0" min="0">

    <button class="btn block" type="button" id="apply">Apply filters</button>
    <a class="reset-link" href="#" id="reset">Reset all</a>
  </aside>

  <section>
    <div class="results-header">
      <h2 class="count" id="count">Loading…</h2>
    </div>
    <div class="sort-bar">
      <label for="sort">Sort</label>
      <select id="sort">
        <option value="deadline">Deadline</option>
        <option value="az">A–Z</option>
        <option value="stipend">Stipend</option>
      </select>
    </div>
    <div id="list" aria-live="polite"></div>
  </section>
</div>

<footer>African Leadership Academy · Opportunity Navigator</footer>

<script>
const DATA = [
  { id:'mit',       title:'MIT Research Fellowship',          field:'STEM',          status:'open',   deadline:'2025-12-15', location:'Cambridge, USA',  stipend:45000 },
  { id:'yc',        title:'Y Combinator Startup School',      field:'Business',      status:'open',   deadline:'2026-01-05', location:'Online',          stipend:0     },
  { id:'rhodes',    title:'Rhodes Scholarship',               field:'Humanities',    status:'open',   deadline:'2025-10-01', location:'Oxford, UK',      stipend:35000 },
  { id:'goldman',   title:'Goldman Sachs Summer Internship',  field:'Business',      status:'soon',   deadline:'2026-02-01', location:'London, UK',      stipend:12000 },
  { id:'ashoka',    title:'Ashoka Young Changemakers',        field:'Social Impact', status:'open',   deadline:'2026-03-01', location:'Global',          stipend:5000  },
  { id:'knight',    title:'Stanford Knight-Hennessy Scholars', field:'Leadership',   status:'open',   deadline:'2025-10-10', location:'Stanford, USA',   stipend:60000 },
  { id:'adobe',     title:'Adobe Design Residency',           field:'Arts',          status:'open',   deadline:'2025-11-30', location:'Remote',          stipend:18000 },
  { id:'schwarz',   title:'Schwarzman Scholars',              field:'Leadership',    status:'closed', deadline:'2025-09-20', location:'Beijing, China',  stipend:55000 },
  { id:'gsoc',      title:'Google Summer of Code',            field:'STEM',          status:'soon',   deadline:'2026-03-15', location:'Remote',          stipend:3000  },
  { id:'echoing',   title:'Echoing Green Fellowship',         field:'Social Impact', status:'open',   deadline:'2026-01-20', location:'Global',          stipend:80000 }
];

const FIELDS = ['STEM','Business','Arts','Humanities','Social Impact','Leadership'];
const STATUS_LABEL = { open:'Open', soon:'Opening soon', closed:'Closed' };

const saved = new Set();
const state = { q:'', fields:new Set(), statuses:new Set(), loc:'', min:0, sort:'deadline', mode:'discover' };

const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];

function statusLabel(s){ return STATUS_LABEL[s] || s; }
function money(n){ return n ? new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n) : 'Unpaid / free'; }
function dateFmt(iso){ return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

function cardHTML(o){
  const isSaved = saved.has(o.id);
  return `
    <article class="card">
      <div class="card-main">
        <div class="tags">
          <span class="tag" data-field="${o.field}">${o.field}</span>
          <span class="status ${o.status}">${statusLabel(o.status)}</span>
        </div>
        <h3><a href="#/opportunity/${o.id}">${o.title}</a></h3>
        <div class="meta">
          <span>Deadline · ${dateFmt(o.deadline)}</span>
          <span>${o.location}</span>
          <span>${money(o.stipend)}</span>
        </div>
      </div>
      <div class="card-side">
        <button class="heart ${isSaved?'on':''}" data-id="${o.id}" aria-pressed="${isSaved}">
          ${isSaved ? '★ Saved' : '☆ Save'}
        </button>
        <a class="btn alt sm" href="#/opportunity/${o.id}">View</a>
      </div>
    </article>`;
}

function render(){
  const list = $('#list');
  const count = $('#count');

  if (state.mode === 'wishlist' && saved.size === 0){
    count.textContent = 'Wishlist';
    list.innerHTML = `<div class="empty">No saved opportunities yet. <a href="#" data-action="discover">Browse all</a></div>`;
    return;
  }

  let items = DATA.filter(o => {
    if (state.mode === 'wishlist' && !saved.has(o.id)) return false;
    if (state.q){
      const hay = `${o.title} ${o.field} ${o.location}`.toLowerCase();
      if (!hay.includes(state.q)) return false;
    }
    if (state.fields.size && !state.fields.has(o.field)) return false;
    if (state.statuses.size && !state.statuses.has(o.status)) return false;
    if (state.loc && !o.location.toLowerCase().includes(state.loc.toLowerCase())) return false;
    if (state.min && o.stipend < state.min) return false;
    return true;
  });

  if (state.sort === 'az')        items.sort((a,b)=>a.title.localeCompare(b.title));
  if (state.sort === 'deadline')  items.sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  if (state.sort === 'stipend')   items.sort((a,b)=>b.stipend-a.stipend);

  const label = state.mode === 'wishlist' ? 'Wishlist' : '';
  count.textContent = state.mode === 'wishlist'
    ? `${items.length} saved`
    : `${items.length} opportunit${items.length === 1 ? 'y' : 'ies'}`;

  if (!items.length){
    list.innerHTML = `<div class="empty">Nothing matches those filters. <a href="#" data-action="reset">Reset filters</a></div>`;
    return;
  }

  list.innerHTML = items.map(cardHTML).join('');
}

function updateSavedBadge(){
  $('#saved-count').textContent = saved.size ? `(${saved.size})` : '';
}

function updateMode(mode){
  state.mode = mode;
  $$('nav button[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  render();
}

function resetFilters(){
  state.q = ''; state.fields.clear(); state.statuses.clear();
  state.loc = ''; state.min = 0; state.sort = 'deadline';
  $('#q').value = ''; $('#loc').value = ''; $('#min').value = ''; $('#sort').value = 'deadline';
  $$('.filters input[type="checkbox"]').forEach(cb => cb.checked = false);
  render();
}

/* --- events --- */
$('#q').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); render(); });
$('#loc').addEventListener('input', e => { state.loc = e.target.value.trim(); render(); });
$('#min').addEventListener('input', e => { state.min = Number(e.target.value) || 0; render(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; render(); });

$$('.filters input[type="checkbox"]').forEach(cb => {
  cb.addEventListener('change', () => {
    state.fields.clear(); state.statuses.clear();
    $$('.filters input[type="checkbox"]:checked').forEach(c => {
      if (FIELDS.includes(c.value)) state.fields.add(c.value);
      else state.statuses.add(c.value);
    });
    render();
  });
});

$('#apply').addEventListener('click', () => {
  $('#list').scrollIntoView({ behavior:'smooth', block:'start' });
});

$('#reset').addEventListener('click', e => { e.preventDefault(); resetFilters(); });

$$('nav button[data-mode]').forEach(b => {
  b.addEventListener('click', () => updateMode(b.dataset.mode));
});

$('#list').addEventListener('click', e => {
  const heart = e.target.closest('.heart');
  if (heart){
    const id = heart.dataset.id;
    saved.has(id) ? saved.delete(id) : saved.add(id);
    updateSavedBadge();
    render();
    return;
  }
  const action = e.target.closest('[data-action]');
  if (action){
    e.preventDefault();
    if (action.dataset.action === 'reset') resetFilters();
    if (action.dataset.action === 'discover') updateMode('discover');
  }
});

/* --- init --- */
updateSavedBadge();
render();
</script>

</body>
</html>
